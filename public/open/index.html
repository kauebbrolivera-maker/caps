<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

       text-shadow:0 0 12px rgba(255,140,30,.35);opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease;pointer-events:none;
       display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

  #news .nw{position:relative;width:min(84vw,360px);padding:14px 16px 16px;border:1px solid rgba(255,186,90,.65);border-radius:6px;overflow:hidden;
       background:linear-gradient(160deg,rgba(60,34,6,.62),rgba(18,10,2,.70));color:#ffe3b5;box-shadow:0 0 22px rgba(255,150,40,.35),inset 0 0 18px rgba(255,160,60,.15);
       transform:rotateX(9deg) rotateY(-11deg);transform-origin:50% 50%;opacity:0;display:none}

  #news .nw::before{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,200,120,.10),transparent);animation:sweep 3.2s linear infinite}

  #news h3{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.3;color:#ffe7c2;text-shadow:0 0 10px rgba(255,150,40,.4)}
  #news p{margin:0;font-size:13px;font-weight:300;line-height:1.45;color:rgba(255,226,186,.88)}
  @keyframes nwIn{0%{opacity:0;transform:rotateX(9deg) rotateY(-11deg) scaleY(.03)}12%{opacity:.9;transform:rotateX(9deg) rotateY(-11deg) scaleY(1)}18%{opacity:.15}26%{opacity:1}32%{opacity:.35}42%,100%{opacity:1;transform:rotateX(9deg) rotateY(-11deg) scaleY(1)}}
  @keyframes nwOut{0%{opacity:1;transform:rotateX(9deg) rotateY(-11deg)}100%{opacity:0;transform:rotateX(9deg) rotateY(-11deg) scaleY(.03)}}
  @keyframes nwFloat{0%,100%{opacity:1;transform:rotateX(9deg) rotateY(-11deg) translateY(0)}50%{opacity:.93;transform:rotateX(7deg) rotateY(-8deg) translateY(-5px)}}
  @keyframes scan{from{background-position:0 0}to{background-position:0 60px}}
  @keyframes sweep{from{top:-40%}to{top:140%}}

  #wxo{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .6s ease}

  #wxo .wd{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,206,140,.88)}
  #wxo .mm{font-size:14px;font-weight:400}

  #wxo .tt{font-size:11px;letter-spacing:.32em;text-indent:.32em;color:rgba(255,196,120,.72)}

  #wxo .tag::before,#wxo .tag::after{content:"";display:inline-block;width:18px;height:1px;background:rgba(255,190,110,.6);vertical-align:middle;margin:0 8px;box-shadow:0 0 6px rgba(255,170,60,.8)}
  #wxo .card{box-sizing:border-box;text-align:left;white-space:normal;border:1px solid rgba(255,186,90,.30);border-radius:3px;overflow:hidden;
     background:linear-gradient(180deg,rgba(255,150,40,.07),rgba(255,150,40,.015));box-shadow:0 0 26px rgba(255,140,30,.10),inset 0 0 24px rgba(255,150,40,.05)}
  #wxo .card::before{content:"";position:absolute;inset:0;pointer-events:none;background:
     linear-gradient(#ffc477,#ffc477) 0 0/16px 2px no-repeat,linear-gradient(#ffc477,#ffc477) 0 0/2px 16px no-repeat,
     linear-gradient(#ffc477,#ffc477) 100% 0/16px 2px no-repeat,linear-gradient(#ffc477,#ffc477) 100% 0/2px 16px no-repeat,
     linear-gradient(#ffc477,#ffc477) 0 100%/16px 2px no-repeat,linear-gradient(#ffc477,#ffc477) 0 100%/2px 16px no-repeat,
     linear-gradient(#ffc477,#ffc477) 100% 100%/16px 2px no-repeat,linear-gradient(#ffc477,#ffc477) 100% 100%/2px 16px no-repeat;filter:drop-shadow(0 0 4px rgba(255,170,60,.9))}
  #wxo .card::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,200,120,.09),transparent);animation:sweep 4.5s linear infinite}
  #wxo .card .ch{display:flex;justify-content:space-between;padding:7px 10px 6px;font-size:10px;letter-spacing:.24em;color:rgba(255,204,136,.88);border-bottom:1px solid rgba(255,186,90,.22)}
  #wxo .card .cols{position:absolute;left:0;right:0;top:27px;bottom:21px;display:flex}
  #wxo .card .cols i{flex:1;border-left:1px solid rgba(255,186,90,.13)}
  #wxo .card .cols i:first-child{border-left:0}
  #wxo .card .cf{position:absolute;left:0;right:0;bottom:0;padding:4px 10px;font-size:9px;letter-spacing:.2em;color:rgba(255,190,120,.5);display:flex;justify-content:space-between;border-top:1px solid rgba(255,186,90,.14)}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .8s ease;
     background:repeating-linear-gradient(0deg,rgba(255,190,110,.028) 0 1px,transparent 1px 3px)}
  #scan.on{opacity:1}
  #scan::after{content:"";position:absolute;left:0;right:0;height:22%;top:-22%;background:linear-gradient(180deg,transparent,rgba(255,190,110,.045),transparent);animation:sweep 6s linear infinite}
  :root{--chat-bottom:calc(max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px)) + var(--tg-content-safe-area-inset-bottom,0px) + 10px)}
  body.chat #sub{top:auto;bottom:calc(var(--chat-bottom) + var(--chat-h,76px) + 12px);transition:opacity .6s ease,transform .6s ease,bottom .25s ease}
  #chat{position:fixed;left:10px;right:10px;bottom:var(--chat-bottom);z-index:6;display:none;flex-direction:column;gap:6px;pointer-events:none}
  body.chat #chat{display:flex}
  #chat .bar{display:flex;align-items:center;gap:8px;pointer-events:auto;padding:6px;border:1px solid rgba(255,176,80,.35);border-radius:28px;
     background:rgba(20,12,3,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(255,140,30,.12)}
  #chat button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,176,80,.45);background:rgba(255,150,40,.08);color:#ffd9a0;
     display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:none}
  #chat button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #chat button:disabled{opacity:.35}
  #chat #cMic.rec{background:rgba(120,220,255,.18);border-color:rgba(140,230,255,.8);color:#bff0ff;box-shadow:0 0 16px rgba(120,220,255,.55);animation:recP 1.2s ease-in-out infinite}
  @keyframes recP{50%{box-shadow:0 0 4px rgba(120,220,255,.3)}}
  #chat input{flex:1;min-width:0;height:40px;border:0;outline:0;background:transparent;color:#ffe6c2;font:inherit;font-size:16px;font-weight:300;padding:0 6px;
     -webkit-user-select:text;user-select:text}
  #chat input::placeholder{color:rgba(255,200,140,.45)}

  #chat .log{pointer-events:auto;display:none;max-height:32vh;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:8px 10px;border-radius:14px;
     border:1px solid rgba(255,176,80,.22);background:rgba(10,6,2,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:13px;line-height:1.4}
  #chat.logon .log{display:block}
  #chat .log div{margin:4px 0;max-width:86%;padding:6px 10px;border-radius:12px;word-wrap:break-word;white-space:pre-wrap}

<body>
<canvas id="c"></canvas>
<div id="glow"></div>
<div id="mark">OPEN</div>
<div id="sub"></div>
<div id="scan"></div>
<div id="wxo"></div>
<div id="news"><div class="nw"><div class="nh"><i></i><span>OPEN &middot; NOT&Iacute;CIA</span></div><img alt="" hidden><h3></h3><p></p></div></div>
<div id="chat">
  <div class="log" id="cLog" aria-live="polite"></div>
  <div class="hint" id="cHint"></div>
  <div class="bar">
    <button id="cLogBtn" type="button" aria-label="Histórico"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <input id="cIn" type="text" enterkeyhint="send" autocomplete="off" placeholder="Fale com o Jarvis…" aria-label="Mensagem">
    <button id="cMic" type="button" aria-label="Microfone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="cSend" type="button" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg></button>
  </div>
</div>
<div id="tap"><button id="tapbtn" type="button">&#9654;&nbsp; TOCAR</button></div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
// ---------- params (query + hash) ----------
function parseParams(){
  var o={}, add=function(s){ new URLSearchParams(s).forEach(function(v,k){ o[k]=v; }); };
  add(location.search.slice(1)); if(location.hash.length>1) add(location.hash.slice(1));
  return o;
}
var P = parseParams();
var params = { text:P.text||null, audio:P.audio||null, sid:P.sid||null, demo:P.demo==='1'||P.demo==='true', showcase:P.showcase==='1'||P.showcase==='true', state:P.state||(P.show==='face'?'face':null), show:P.show||null, expr:P.expr||null,
               start_param:null, raw:P };
window.openParams = params;
var CAPTURE = false; // test-only manual clock removed in the published build

// ---------- Telegram (graceful outside) ----------
window.__openTg = function(){
  try{
    var tg = window.Telegram && window.Telegram.WebApp; if(!tg || (!tg.initData && (!tg.platform || tg.platform==='unknown'))) return; // outside Telegram
    var v=function(x){ try{ return tg.isVersionAtLeast(x); }catch(e){ return false; } };
    tg.ready(); tg.expand();
    if(v('6.1')){ try{ tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); }catch(e){} }
    if(v('7.10')){ try{ tg.setBottomBarColor('#000000'); }catch(e){} }
    if(v('7.7')){ try{ tg.disableVerticalSwipes(); }catch(e){} }
    var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    if(sp){ params.start_param = sp; if(!params.sid) params.sid = sp; }
  }catch(e){ /* not in Telegram */ }
};
if(window.Telegram && window.Telegram.WebApp) window.__openTg();

// ---------- renderer ----------
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:false, alpha:false, powerPreference:'high-performance'});
renderer.setClearColor(0x000000,1);
var PR = Math.min(window.devicePixelRatio||1, 2);
renderer.setPixelRatio(PR);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(45,1,0.1,100);

var lowEnd = (navigator.hardwareConcurrency||8) <= 4;
var N = Math.max(1000, Math.min(12000, parseInt(P.n,10) || (lowEnd ? 5000 : 7000)));

// ---------- procedural face (line-drawing point cloud) ----------
function buildFace(count){
  var curves = []; // each: {pts:[[x,y,tag]], }
  function curve(fn, steps, tag, side){ var a=[]; for(var i=0;i<=steps;i++){ var p=fn(i/steps); a.push([p[0],p[1],tag||0,i/steps,side||0]); } curves.push(a); }
  var W=0.80, H=1.12;
  function halfW(y){ var t=Math.max(-1,Math.min(1,y/H)); var w=W*Math.sqrt(Math.max(0,1-t*t)); if(y<0) w*=1-0.22*t*t; return w; }
  curve(function(u){ var a=u*Math.PI*2; var y=H*Math.cos(a); var x=W*Math.sin(a); if(y<0) x*=1-0.22*Math.pow(y/H,2); return [x,y]; },160);
  for(var y=0.56;y<=0.98;y+=0.065){ (function(yy){ var w=halfW(yy)*0.82; curve(function(u){ return [-w+2*w*u, yy+0.012*Math.sin(u*Math.PI)]; },30); })(y); }
  [-1,1].forEach(function(s){
    curve(function(u){ return [s*(0.14+0.46*u), 0.40+0.06*Math.sin(Math.PI*(0.15+0.85*u))]; },24,3,s);            // brow
    curve(function(u){ return [s*(0.17+0.38*u), 0.21+0.075*Math.sin(Math.PI*u)]; },22,4,s);                     // eye upper
    curve(function(u){ return [s*(0.17+0.38*u), 0.21-0.05*Math.sin(Math.PI*u)]; },22,5,s);                      // eye lower
    curve(function(u){ var a=u*Math.PI*2; return [s*0.36+0.055*Math.cos(a), 0.215+0.055*Math.sin(a)]; },18,6,s);   // iris
    curve(function(u){ var a=u*Math.PI*2; return [s*0.36+0.02*Math.cos(a), 0.215+0.02*Math.sin(a)]; },8,7,s);
    for(var x=0.24;x<=0.62;x+=0.055){ (function(xx){ curve(function(u){ return [s*xx, -0.02-0.24*u]; },10); })(x); } // cheek hatch
    curve(function(u){ return [s*(0.065+0.03*u), 0.14-0.40*u]; },16);                                     // nose side
  });
  curve(function(u){ return [-0.13+0.26*u, -0.27-0.035*Math.sin(Math.PI*u)]; },14);                       // nose base
  curve(function(u){ var x=-0.30+0.60*u; return [x, -0.50+0.035*Math.cos(x*10.5)*(1-Math.abs(x)/0.3)]; },26,8); // upper lip
  curve(function(u){ return [-0.27+0.54*u, -0.535]; },20,9);                                              // mouth line (moves a bit)
  curve(function(u){ return [-0.27+0.54*u, -0.555-0.075*Math.sin(Math.PI*u)]; },24,10);                   // lower lip (moves)
  for(var y2=-0.74;y2>=-0.92;y2-=0.06){ (function(yy){ var w=halfW(yy)*0.55; curve(function(u){ return [-w+2*w*u, yy]; },14); })(y2); }
  // lengths
  var segs=[], total=0;
  curves.forEach(function(c){ for(var i=1;i<c.length;i++){ var a=c[i-1], b=c[i]; var l=Math.hypot(b[0]-a[0],b[1]-a[1]); segs.push([a,b,l,total]); total+=l; } });
  var out = new Float32Array(count*4), fp = new Float32Array(count*2), si=0;
  for(var k=0;k<count;k++){
    var d = (k+Math.random()*0.8)/count*total;
    while(si<segs.length-1 && segs[si][3]+segs[si][2] < d) si++;
    var s=segs[si], t=s[2]>0?(d-s[3])/s[2]:0;
    var x=s[0][0]+(s[1][0]-s[0][0])*t + (Math.random()-0.5)*0.014;
    var y=s[0][1]+(s[1][1]-s[0][1])*t + (Math.random()-0.5)*0.014;
    var z = 0.42*(1 - 0.85*Math.pow(x/W,2) - 0.25*Math.pow(y/H,2)) - 0.25 + (Math.abs(x)<0.12 && y<0.15 && y>-0.3 ? 0.10 : 0);
    out[k*4]=x; out[k*4+1]=y; out[k*4+2]=z; out[k*4+3]=s[0][2];
    fp[k*2]=s[0][3]+(s[1][3]-s[0][3])*t; fp[k*2+1]=s[0][4];
  }
  return {pos:out, fp:fp};
}

// ---------- geometry ----------
var pos = new Float32Array(N*3), rnd = new Float32Array(N*4);
var nFace = Math.floor(N*0.9), face = new Float32Array(N*4), faceFP = new Float32Array(N*2), FB = buildFace(nFace), faceCore = FB.pos;
for(var i=0;i<N;i++){
  var u=Math.random(), v=Math.random(), th=2*Math.PI*u, ph=Math.acos(2*v-1);
  var dx=Math.sin(ph)*Math.cos(th), dy=Math.cos(ph), dz=Math.sin(ph)*Math.sin(th);
  var q=Math.random(), r, kind=0;
  if(q<0.78) r = 0.88+0.14*Math.random();            // shell
  else if(q<0.93) r = 0.9*Math.cbrt(Math.random());   // interior
  else { r = 1.15+0.9*Math.random(); kind=1; }        // dust
  pos[i*3]=dx*r; pos[i*3+1]=dy*r; pos[i*3+2]=dz*r;
  rnd[i*4]=Math.random(); rnd[i*4+1]=Math.random(); rnd[i*4+2]=Math.random(); rnd[i*4+3]= kind ? -Math.random() : Math.random();
}
// assign face targets (dust + leftovers scatter softly around)
var order = []; for(i=0;i<N;i++) order.push(i); order.sort(function(){ return Math.random()-0.5; });
var fi=0;
for(var j=0;j<N;j++){
  var id=order[j];
  if(rnd[id*4+3]>=0 && fi<nFace){ face[id*4]=faceCore[fi*4]; face[id*4+1]=faceCore[fi*4+1]; face[id*4+2]=faceCore[fi*4+2]; face[id*4+3]=faceCore[fi*4+3]; faceFP[id*2]=FB.fp[fi*2]; faceFP[id*2+1]=FB.fp[fi*2+1]; fi++; }
  else { var a=Math.random()*6.283, rr=1.2+Math.random()*1.0; face[id*4]=Math.cos(a)*rr; face[id*4+1]=(Math.random()-0.5)*2.6; face[id*4+2]=Math.sin(a)*rr*0.5-0.6; face[id*4+3]=-1; }
}
var geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd,4));
geo.setAttribute('aFace', new THREE.BufferAttribute(face,4));
geo.setAttribute('aFP', new THREE.BufferAttribute(faceFP,2));
var SA = new Float32Array(N*4), SB = new Float32Array(N*4);
geo.setAttribute('aSA', new THREE.BufferAttribute(SA,4).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('aSB', new THREE.BufferAttribute(SB,4).setUsage(THREE.DynamicDrawUsage));
var AA = new Float32Array(N*4), AB = new Float32Array(N*4);   // per-point animation channel (code, p1, p2, p3) for shape A / B
geo.setAttribute('aAA', new THREE.BufferAttribute(AA,4).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('aAB', new THREE.BufferAttribute(AB,4).setUsage(THREE.DynamicDrawUsage));

var U = {
  uTime:{value:0}, uLevel:{value:0}, uBass:{value:0}, uMid:{value:0}, uHigh:{value:0},

  for(var i=0;i<KW3.length;i++) if(KW3[i][0].test(n)) return KW3[i][1]; return null; }
function answerVisual(ans, text){
  ans=ans||{}; var o={}, w=(ans.weather && typeof ans.weather==='object') ? ans.weather : null; if(w) o.weather=w;
  if(ans.text_shape!=null && String(ans.text_shape).trim()) o.text=String(ans.text_shape).trim().slice(0,40);
  var nm=ans.shape ? String(ans.shape).toLowerCase().trim() : '';
  if(nm==='none' || nm==='sphere' || nm==='idle') return null;
  if(!nm && o.text) nm='text';
  if(!nm && w) nm=/previs|amanh|semana|proximos dias|próximos dias/i.test(text) ? 'forecast' : 'weather';
  if(!nm && P.autoshape!=='0') nm=keywordShape(text)||'';
  if(!nm) return null; nm=ALIAS3[nm]||nm;
  if(!FACES3[nm] && !BUILD[nm] && !SHAPES[nm]){ console.warn('[open] unknown shape', nm); return null; }
  return {name:nm, opts:o};
}
window.openVisualFor=answerVisual; window.openKeywordShape=keywordShape;
// ---- ask flow ----
function ask(text){
  text=String(text||'').trim(); if(!text) return Promise.resolve(null);
  if(!CH.transport){ chatHint('conversa ainda não conectada'); caption(CHAT_ERR.none, 3000); return Promise.resolve(null); }
  if(CH.busy) return Promise.resolve(null);
  CH.busy=true; CH.send.disabled=true; CH.inp.value=''; stopAll(); logLine('u', text); CH.history.push({role:'user', text:text});
  window.openState('thinking'); caption(text, 2500); chatHint('pensando…');
  var msg={sid:nextSid(), text:text, chat_id:tgUser()};
  try{ window.dispatchEvent(new CustomEvent('open:ask',{detail:msg})); }catch(e){}
  var guard=new Promise(function(_,rej){ setTimeout(function(){ msg.cancelled=true; rej(chatErr('timeout')); }, CH.TIMEOUT+3000); });
  return Promise.race([Promise.resolve().then(function(){ return CH.transport.send(msg); }), guard]).then(function(ans){
    ans=ans||{}; var t=String(ans.text||'').trim(); if(!t) throw chatErr('bot');
    logLine('b', t); CH.history.push({role:'bot', text:t, expr:ans.expr}); chatHint('');
    var vis=answerVisual(ans, t); CH.pin=!!ans.pin || !!(vis && vis.name==='timer');
    if(vis && !FACES3[vis.name]) openShow(vis.name, vis.opts); else openFace(vis ? vis.name : (ans.expr||'neutral'));
    CH.awaitEnd=true;
    if(ans.audio && /^https?:\/\//i.test(String(ans.audio))) speak(String(ans.audio), t, {fallbackMs:4000}); else say(t);
    try{ window.dispatchEvent(new CustomEvent('open:answer',{detail:{sid:msg.sid, text:t, expr:ans.expr, audio:ans.audio||null}})); }catch(e){}
    return ans;
  }).catch(function(e){
    var m=(e&&e.kind)?e.message:CHAT_ERR.bot; console.warn('[open] chat:', m);
    logLine('s', m); chatHint(''); openFace('sad'); caption(m, 4500);
    setTimeout(function(){ if(!CH.busy && state==='face' && expr==='sad') window.openState('idle'); }, 3000);
    return null;
  }).then(function(r){ CH.busy=false; CH.send.disabled=!CH.transport; return r; });
}
window.addEventListener('open:ended', function(){ if(CH.awaitEnd){ CH.awaitEnd=false; if(CH.pin) return; setTimeout(function(){ if(!CH.busy && state!=='speaking') window.openState('idle'); }, 900); } });
CH.send.addEventListener('click', function(){ unlockAudio(); ask(CH.inp.value); CH.inp.focus(); });
CH.inp.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); unlockAudio(); ask(CH.inp.value); } });
// ---- mic (Web Speech recognition, pt-BR): hold = push-to-talk, tap = toggle ----
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recStart(){
  if(!SR || CH.recOn || CH.busy) return;
  var r=new SR(); r.lang='pt-BR'; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  CH.rec=r; CH.recOn=true; CH.recText=''; CH.mic.classList.add('rec'); stopAll(); window.openState('listening'); caption('ouvindo…',0); chatHint('ouvindo… toque de novo para enviar');
  r.onresult=function(ev){ var s=''; for(var i=0;i<ev.results.length;i++) s+=ev.results[i][0].transcript; CH.recText=s; caption(s||'ouvindo…',0); };
  r.onerror=function(ev){ var m = ev.error==='not-allowed'||ev.error==='service-not-allowed' ? 'Microfone bloqueado. Libere o acesso ou digite.' :
      ev.error==='no-speech' ? 'Não ouvi nada. Tenta de novo?' : ev.error==='aborted' ? '' : 'Reconhecimento de voz falhou ('+ev.error+').';
    if(m){ chatHint(m); setTimeout(function(){ if(CH.hint.textContent===m) chatHint(''); }, 3500); } };
  r.onend=function(){ CH.recOn=false; CH.mic.classList.remove('rec'); var t=CH.recText.trim(); CH.rec=null;
    if(t){ ask(t); } else { caption('',0); if(state==='listening') window.openState('idle'); if(/ouvindo/.test(CH.hint.textContent)) chatHint(''); } };
  try{ r.start(); }catch(e){ CH.recOn=false; CH.mic.classList.remove('rec'); }
}
function recStop(){ if(CH.rec){ try{ CH.rec.stop(); }catch(e){} } }
if(!SR){ CH.mic.style.display='none'; }
else {
  CH.mic.addEventListener('pointerdown', function(e){ e.preventDefault(); unlockAudio(); if(CH.recOn){ recStop(); CH.ignoreUp=true; return; } CH.downAt=Date.now(); recStart(); });
  CH.mic.addEventListener('pointerup', function(){ if(CH.ignoreUp){ CH.ignoreUp=false; return; } if(CH.recOn && Date.now()-CH.downAt>450) recStop(); });
  CH.mic.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
// ---- config from URL / hash ----
function bootChat(){
  var off = P.chat==='0' || P.chat==='false' || ((params.demo || P.showcase==='1' || P.showcase==='true') && P.chat!=='1');
  if(off) return;
  document.body.classList.add('chat'); setTimeout(chatH,0);
  var tr=(P.transport||'').toLowerCase();
  if(tr==='http' && P.base) setTransport(httpTransport(P.base));
  else if(tr==='ntfy' && P.topic) setTransport(ntfyTransport(P.server||'https://ntfy.sh', P.topic));
  else setTransport(null);
}
window.openAsk=ask; Open.ask=ask; Open.setTransport=setTransport; Open.chat=CH;
Object.defineProperty(Open,'transport',{get:function(){ return CH.mode; }});
window.addEventListener('message', function(ev){ var d=ev.data; if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){ return; } } if(d && d.type==='ask' && d.text) ask(d.text); });

// ---------- loop ----------
var last=performance.now()/1000, clock=0;
function frame(dt){
  dt=Math.min(dt,0.05); clock+=dt;
  if(params.demo){
    demoClock+=dt; var tt=demoClock%DEMO_T, acc=0, di=0;
    for(var i=0;i<DEMO.length;i++){ acc+=DEMO[i][1]; if(tt<acc){ di=i; break; } }
    var seg=DEMO[di];
    if(di!==demoPrev){
      demoPrev=di;
      if(seg[0]==='face'){ setExpr(seg[2]); setState('face'); } else { if(di===0) setExpr('neutral'); setState(seg[0]); }
      if(seg[3]){ setState('speaking'); fake.on=true; fake.t0=clock; fake.boundaries=false; caption(seg[3], seg[1]*1000+200); }
      else fake.on=false;
    }
    demoTick(clock-fake.t0, !!seg[3]);
  }
  readLevels(CAPTURE||params.demo ? clock : performance.now()/1000, dt);
  var a=Math.min(1,dt*3.2);
  U.uListen.value+=(tgt[0]-U.uListen.value)*a; U.uThink.value+=(Math.max(tgt[1], newsOn&&tgt[3]<0.5?0.9:0)-U.uThink.value)*a;
  U.uSpeak.value+=(tgt[2]-U.uSpeak.value)*a;   U.uFace.value+=(tgt[3]-U.uFace.value)*Math.min(1,dt*1.8*MORPH);
  U.uTime.value=clock;
  U.uRot.value += dt*(0.12 + 0.25*U.uThink.value - 0.06*U.uListen.value + 0.15*lv.level*U.uSpeak.value);
  U.uSwirl.value += dt*1.1*U.uThink.value;
  faceTick(dt);
  showTick(dt);
  U.uLevel.value=lv.level; U.uBass.value=lv.bass; U.uMid.value=lv.mid; U.uHigh.value=lv.high;
  glowEl.style.opacity = (0.45+lv.level*U.uSpeak.value*1.3 + 0.15*U.uListen.value).toFixed(3);
  renderer.render(scene,camera);
}
var glowEl=document.getElementById('glow');
if(params.expr) setExpr(params.expr);
if(params.state) setState(params.state);
{
  (function loop(){ requestAnimationFrame(loop); if(document.hidden) return; var n=performance.now()/1000; frame(n-last); last=n; })();
}

// ---------- boot from params ----------
function boot(){
  if(P.showcase==='1'||P.showcase==='true'){ startShowcase(); return; }
  if(params.demo){ var c=getCtx(); if(c && !CAPTURE){ demoAudio(true); if(c.state!=='running') c.resume().catch(function(){}); } return; }
  if(params.audio){ speak(params.audio, params.text); return; }
  if(params.text && !/^(text|news)$/i.test(P.show||'')){
    var ua=navigator.userActivation;
    if(!ua || !ua.hasBeenActive){ caption(params.text,0); needTap(function(){ speakTTS(params.text); }); }
    else speakTTS(params.text);
  }
}
boot();
bootShow();
bootChat();
})();
